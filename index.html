<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>신메뉴 시식 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --bg:#ecebe7;--surface:#fff;--surface-2:#faf9f7;--field:#f4f2ee;
    --ink:#1d1b18;--muted:#6f6b64;--faint:#9a958d;--line:#e6e3dd;--line-strong:#d4d0c8;
    --accent:#c1553a;--accent-ink:#fff;--accent-soft:#f3e2db;--good:#2f8f5b;--warn:#c9922b;--bad:#c0433a;
    --shadow:0 1px 2px rgba(30,25,20,.04),0 10px 30px -14px rgba(30,25,20,.18);--r:14px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#100f0e;--surface:#1d1b19;--surface-2:#181615;--field:#26231f;
    --ink:#f0ede7;--muted:#a8a29a;--faint:#726d64;--line:#302d29;--line-strong:#413d37;
    --accent:#e0755a;--accent-soft:#3a251e;--good:#4bb078;--warn:#e0ab48;--bad:#e0655b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --bg:#100f0e;--surface:#1d1b19;--surface-2:#181615;--field:#26231f;
    --ink:#f0ede7;--muted:#a8a29a;--faint:#726d64;--line:#302d29;--line-strong:#413d37;
    --accent:#e0755a;--accent-soft:#3a251e;--good:#4bb078;--warn:#e0ab48;--bad:#e0655b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:9px}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:3px}
  .seg button{border:none;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:7px 15px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .theme-btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);border-radius:9px;padding:0 11px;font-size:13px;cursor:pointer;font-family:inherit}
  /* FORM */
  .phone{max-width:440px;margin:0 auto;background:var(--surface);min-height:calc(100vh - 52px);box-shadow:var(--shadow);position:relative}
  .pbar{position:sticky;top:52px;z-index:20;height:4px;background:var(--line)}.pbar>i{display:block;height:100%;width:8%;background:var(--accent);transition:width .3s}
  .hero{background:linear-gradient(160deg,var(--accent-soft),transparent 70%);padding:22px 20px 18px;border-bottom:1px solid var(--line)}
  .brands{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .bpill{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff}
  .hero h1{font-size:21px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
  .hero p{font-size:13px;color:var(--muted);margin:0}
  .meta-line{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin-top:10px}
  .rubric{margin:16px 20px 0;border:1px dashed var(--line-strong);border-radius:12px;overflow:hidden}
  .rubric summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:7px;background:var(--surface-2)}
  .rubric summary::-webkit-details-marker{display:none}.rubric[open] summary{border-bottom:1px solid var(--line)}
  .rubric .rb-body{padding:12px 14px;font-size:12px}
  .rb-row{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}.rb-row:last-child{border-bottom:none}
  .rb-n{font-family:"IBM Plex Mono",monospace;font-weight:600}.rb-n.s5{color:var(--good)}.rb-n.s3{color:var(--warn)}.rb-n.s1{color:var(--bad)}
  .rb-note{font-size:11px;color:var(--faint);margin-top:9px}
  section.q{padding:20px;border-top:10px solid var(--bg)}section.q:first-of-type{border-top:none}
  .q-num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);letter-spacing:.06em}
  .prod-head{display:flex;align-items:center;gap:9px;margin:3px 0}.prod-head .bdot{width:9px;height:9px;border-radius:50%}.prod-head h2{font-size:18px;margin:0;font-weight:700}
  .bname{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
  .qlabel{font-size:15px;font-weight:600;margin:2px 0 14px}.req{color:var(--accent);font-size:13px}
  .axis{margin-bottom:14px}
  .axis-name{font-size:13.5px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}.axis-name .hint{font-size:11px;color:var(--faint)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .sbtn{border:1px solid var(--line-strong);background:var(--field);color:var(--muted);border-radius:10px;padding:11px 0;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;cursor:pointer;transition:all .12s;text-align:center}
  .sbtn:hover{border-color:var(--accent)}.sbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
  .scale-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:5px;font-family:"IBM Plex Mono",monospace}
  .choices{display:flex;flex-direction:column;gap:8px}.choices.row{flex-direction:row}
  .cbtn{flex:1;border:1px solid var(--line-strong);background:var(--field);color:var(--ink);border-radius:11px;padding:13px 14px;font-size:14px;cursor:pointer;font-family:inherit;text-align:left;transition:all .12s;display:flex;align-items:center;gap:9px}
  .choices.row .cbtn{justify-content:center;text-align:center}.cbtn:hover{border-color:var(--accent)}.cbtn.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .cbtn .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0}.cbtn.on .rd{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 42%,transparent 46%)}
  textarea{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:11px;padding:12px 13px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:74px}textarea:focus{outline:none;border-color:var(--accent)}
  .optional-mod{border:1px solid var(--line);border-left:3px solid var(--good);border-radius:10px;background:var(--surface-2);padding:12px 14px}
  .optional-mod .modtag{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--good);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .submit-wrap{padding:22px 20px 40px}
  .submit{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:13px;padding:16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:var(--shadow)}
  .submit:hover{filter:brightness(1.05)}.submit:disabled{opacity:.5;cursor:not-allowed}
  .foot-note{text-align:center;font-size:11px;color:var(--faint);margin-top:14px;font-family:"IBM Plex Mono",monospace}
  .err{color:var(--bad);font-size:13px;text-align:center;margin-top:10px;display:none}
  .done{position:fixed;inset:52px 0 0;background:var(--surface);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;z-index:40}
  .done.show{display:flex}.done .em{font-size:52px;margin-bottom:14px}.done h2{font-size:22px;margin:0 0 8px}.done p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .done .again{background:var(--field);border:1px solid var(--line-strong);color:var(--muted);border-radius:10px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;margin:5px}
  .done .row2{display:flex;gap:8px}
  /* DASHBOARD */
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 70px}
  .dash-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .dash-head h1{font-size:22px;margin:0}.dash-head .sub{color:var(--muted);font-size:13px}
  .live{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--good);display:inline-flex;align-items:center;gap:5px}.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:blink 2s infinite}@keyframes blink{50%{opacity:.3}}
  .dbtn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);border-radius:9px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer}.dbtn:hover{border-color:var(--accent)}
  .filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);margin-bottom:18px}
  .filter-row{display:flex;gap:20px;flex-wrap:wrap}.fgroup{display:flex;flex-direction:column;gap:6px}
  .flabel{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center}
  .chip:hover{border-color:var(--accent);color:var(--ink)}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .brand-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .k-label{font-size:12px;color:var(--muted);margin-bottom:8px}.kpi .k-val{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:600;line-height:1}.kpi .k-val small{font-size:13px;color:var(--faint)}.kpi .k-note{font-size:11px;color:var(--faint);margin-top:6px}
  .grid{display:grid;gap:14px}.g2{grid-template-columns:1.05fr .95fr}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);min-width:0}
  .card h2{font-size:15px;font-weight:600;margin:0 0 3px}.card .cap{font-size:12px;color:var(--faint);margin:0 0 14px}
  section.block{margin-top:14px}
  .insight{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}.insight b{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px 8px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:none}
  .prod-cell b{font-weight:600}.prod-cell span{display:block;font-size:11px;color:var(--faint)}
  .signal{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .sig-go{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.sig-hold{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.sig-no{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .score-b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
  .heat{display:grid;gap:4px;overflow-x:auto}.heat-row{display:grid;gap:4px;min-width:430px}
  .heat-h{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);text-align:center;padding:4px 0}
  .heat-rl{font-size:12px;color:var(--muted);display:flex;align-items:center;font-weight:500}
  .cell{border-radius:7px;padding:10px 0;text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:var(--ink)}
  .radar-wrap{display:flex;justify-content:center;padding:6px 0}.radar-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}.lg{display:inline-flex;align-items:center;gap:6px}.lg i{width:11px;height:3px;border-radius:2px}
  .bar-row{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
  .bar-track{background:var(--surface-2);border-radius:6px;height:21px;overflow:hidden;border:1px solid var(--line)}.bar-fill{height:100%;border-radius:6px 0 0 6px;background:var(--accent);transition:width .4s}.bar-fill.alt{background:color-mix(in srgb,var(--accent) 55%,var(--muted))}
  .bar-val{text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:12px}.winner{color:var(--accent);font-weight:600}
  .op{border-left:2px solid var(--line-strong);padding:3px 0 3px 13px;margin-bottom:12px;font-size:12.5px}.op .op-meta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);margin-top:4px}.op q{color:var(--ink)}
  .prod-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pp{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted);display:flex;align-items:center}.pp:hover{color:var(--ink);border-color:var(--accent)}.pp.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .empty{color:var(--faint);font-size:13px;padding:44px 20px;text-align:center;line-height:1.7}
  /* lock panel */
  .lock{max-width:360px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 24px;text-align:center}
  .lock .lk{font-size:38px;margin-bottom:10px}.lock h2{font-size:18px;margin:0 0 6px}.lock p{color:var(--muted);font-size:13px;margin:0 0 16px}
  .lock input{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:10px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--ink);text-align:center;margin-bottom:10px}
  .lock input:focus{outline:none;border-color:var(--accent)}
  .lock button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .lock .lerr{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
  .banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;display:none}
  .dbtn{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .dbtn:hover{border-color:var(--accent);color:var(--ink)}select.dbtn{padding:6px 8px;max-width:150px}
  .admin{max-width:760px}
  .admin>h1{font-size:20px;margin:4px 0 2px}
  .acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .acard h3{font-size:14px;margin:0 0 12px;font-weight:600;overflow:hidden}
  .srow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.srow:last-child{border-bottom:none}
  .srow .si b{font-weight:600}.srow .si span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
  .active-badge{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:2px 7px;margin-left:6px;white-space:nowrap}
  .abtn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .abtn:hover{color:var(--ink);border-color:var(--accent)}
  .abtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.abtn.primary:hover{color:#fff;filter:brightness(1.05)}
  .abtn.ghost{background:none;font-weight:400}
  .arow-actions{display:flex;gap:6px;flex-shrink:0}
  .fld{margin-bottom:13px}.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--ink)}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
  .erow{display:grid;gap:6px;align-items:center;margin-bottom:7px}
  .erow input,.erow select{border:1px solid var(--line-strong);background:var(--field);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);min-width:0}
  .erow .del{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--bad);border-radius:8px;cursor:pointer;font-size:16px;line-height:1;padding:0}
  input.acolor{padding:3px!important;height:36px;cursor:pointer}
  .addbtn{border:1px dashed var(--line-strong);background:none;color:var(--muted);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;margin-top:4px}
  .addbtn:hover{color:var(--accent);border-color:var(--accent)}
  .qrbox{text-align:center;padding:12px 0 4px}.qrbox img{border:10px solid #fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .asaved{color:var(--good);font-size:12.5px;align-self:center}
  .imgchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .imgc{border:1px solid var(--line-strong);background:var(--field);border-radius:12px;padding:8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:7px;align-items:center;transition:all .12s}
  .imgc img{width:100%;height:130px;object-fit:cover;border-radius:8px;display:block}
  .imgc .noimg{width:100%;height:130px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
  .imgc span{font-size:14px;color:var(--ink);font-weight:500}
  .imgc:hover{border-color:var(--accent)}
  .imgc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
  .imgc.on span{color:var(--accent);font-weight:700}
  .prev-wrap{max-height:440px;overflow:auto;border:1px solid var(--line-strong);border-radius:12px;background:var(--bg);padding:0}
  .prev-body{max-width:420px;margin:0 auto;background:var(--surface);pointer-events:none;box-shadow:0 0 0 1px var(--line)}
  .prev-body .rubric{margin:16px 14px 0}.prev-body section.q{padding:16px 16px}
  section.q.missing{box-shadow:inset 5px 0 0 var(--bad),0 0 0 2px color-mix(in srgb,var(--bad) 40%,transparent);border-radius:6px;animation:shakeq .32s}
  @keyframes shakeq{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media(prefers-reduced-motion:reduce){section.q.missing{animation:none}}
  .hidden{display:none!important}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.dash-head h1{font-size:19px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="seg">
    <button id="tabForm" class="on">📝 응답하기</button>
    <button id="tabRes">📊 결과 보기</button>
    <button id="tabAdmin">⚙️ 관리</button>
  </div>
  <button class="theme-btn" id="themeBtn">◐</button>
</div>

<div id="formView">
  <div class="phone">
    <div class="pbar"><i id="pbar"></i></div>
    <div id="app"><div class="empty">불러오는 중…</div></div>
  </div>
  <div class="done" id="done">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
let CFG=null,AXES=[],sb=null;
const CONF=window.SURVEY_CONFIG||{};
try{ if(CONF.SUPABASE_URL&&!CONF.SUPABASE_URL.includes("여기에")) sb=window.supabase.createClient(CONF.SUPABASE_URL,CONF.SUPABASE_ANON_KEY); }catch(e){}
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const brandColor=n=>{const b=(CFG.meta.brands||[]).find(x=>x.name===n);return b?b.color:"var(--accent)";};
const brandList=()=>(CFG.meta.brands||[]).map(b=>b.name);

async function loadActiveSurvey(){
  let cfg=null;
  if(sb){
    try{
      const {data}=await sb.from("svy_surveys").select("*").eq("is_open",true).order("created_at",{ascending:false}).limit(1);
      if(data&&data.length){ cfg=data[0].config; cfg.slug=data[0].slug; }
    }catch(e){}
  }
  if(!cfg){
    try{ cfg=await fetch("questions.json").then(r=>r.json()); }
    catch(e){ $("app").innerHTML='<div class="empty">설문을 불러오지 못했습니다.</div>'; return; }
    if(sb){ try{ await sb.from("svy_surveys").upsert({slug:cfg.slug,title:cfg.meta.title,config:cfg,is_open:true}); }catch(e){} }
  }
  CFG=cfg; AXES=cfg.axes; renderForm(); buildFilters();
}
loadActiveSurvey();

/* 관리자 모드: 주소에 #admin 이 있을 때만 결과·관리 탭 노출. QR(일반 주소) 응답자는 응답 폼만 봄 */
function applyAdminVisibility(){
  const adm=/admin|manage/i.test(location.hash+location.search);
  const sg=document.querySelector(".topbar .seg"); if(sg) sg.classList.toggle("hidden",!adm);
}
applyAdminVisibility();
window.addEventListener("hashchange",applyAdminVisibility);

/* view switch */
let view="form";
function setView(v){
  view=v;
  $("tabForm").classList.toggle("on",v==="form");
  $("tabRes").classList.toggle("on",v==="results");
  $("tabAdmin").classList.toggle("on",v==="admin");
  $("formView").classList.toggle("hidden",v!=="form");
  $("resView").classList.toggle("hidden",v!=="results");
  $("adminView").classList.toggle("hidden",v!=="admin");
  if(v==="results"){ if(unlocked){ startDash(); } else { setTimeout(()=>$("lockInput").focus(),50); } }
  if(v==="admin"){ if(unlocked){ $("adminLock").classList.add("hidden");$("adminBody").classList.remove("hidden");openAdmin(); } else { setTimeout(()=>$("alockInput").focus(),50); } }
}
$("tabForm").onclick=()=>setView("form");
$("tabRes").onclick=()=>setView("results");
$("tabAdmin").onclick=()=>setView("admin");
function tryUnlockAdmin(){
  const key=(CONF.RESULTS_KEY||"").toString();const v=$("alockInput").value.trim();
  if(key && v!==key){ $("alockErr").textContent="비밀번호가 올바르지 않습니다."; return; }
  unlocked=true; try{sessionStorage.setItem("svy_unlocked","1");}catch(e){}
  $("adminLock").classList.add("hidden");$("adminBody").classList.remove("hidden");openAdmin();
}
$("alockBtn").onclick=tryUnlockAdmin;
$("alockInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlockAdmin();});
$("themeBtn").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const n=c==="dark"?"light":(c==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));document.documentElement.setAttribute("data-theme",n);};

/* ===== FORM ===== */
const answers={scores:{},extras:{},gender:null,age:null};
function buildFormHtml(cfg,opt){
  opt=opt||{};const m=cfg.meta||{};const AX=cfg.axes||[];const SEG=cfg.segments||{gender:[],age:[]};
  const bcol=n=>{const b=(m.brands||[]).find(x=>x.name===n);return b?b.color:"var(--accent)";};
  let h=`<div class="hero"><div class="brands">${(m.brands||[]).map(b=>`<span class="bpill" style="background:${esc(b.color)}">${esc(b.name)}</span>`).join("")}</div>
    <h1>${esc(m.title||'')}</h1><p>${esc(m.intro||'')}</p><div class="meta-line"><span class="req">*</span> 표시는 꼭 응답해야 제출됩니다</div></div>`;
  if(m.showRubric!==false && cfg.rubric&&cfg.rubric.length) h+=`<details class="rubric"><summary>📖 점수 기준 보기</summary><div class="rb-body">${cfg.rubric.map(r=>`<div class="rb-row"><span class="rb-n ${r.cls||''}">${esc(r.n)}</span><span>${esc(r.text)}</span></div>`).join("")}<p class="rb-note">※ 다섯 축 모두 같은 기준입니다.</p></div></details>`;
  h+=`<form id="form"><section class="q"><div class="q-num">Q1 · 응답자 정보</div>
    <div class="qlabel">성별 <span class="req">*</span></div><div class="choices row" data-seg="gender">${(SEG.gender||[]).map(v=>`<button type="button" class="cbtn" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>
    <div class="qlabel" style="margin-top:16px">연령대 <span class="req">*</span></div><div class="choices row" data-seg="age">${(SEG.age||[]).map(v=>`<button type="button" class="cbtn" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div></section>`;
  let n=2;
  (cfg.blocks||[]).forEach(b=>{
    if(b.type==="product"){
      h+=`<section class="q"><div class="q-num">Q${n}</div><div class="prod-head"><span class="bdot" style="background:${bcol(b.brand)}"></span><h2>${esc(b.name)}</h2></div>
        <div class="prod-head" style="margin:-2px 0 14px 18px"><span class="bname">${esc(b.brand)} · ${esc(b.tag||"")}</span></div>`;
      AX.forEach(a=>{h+=`<div class="axis"><div class="axis-name"><span>${esc(a.label)} <span class="req">*</span></span><span class="hint">${esc(a.hint||"")}</span></div>
        <div class="scale" data-prod="${esc(b.name)}" data-axis="${a.key}">${[5,4,3,2,1].map(x=>`<button type="button" class="sbtn" data-v="${x}">${x}</button>`).join("")}</div>
        <div class="scale-ends"><span>매우 좋음</span><span>매우 아쉬움</span></div></div>`;});
      h+=`</section>`;
    }else if(b.type==="price"||b.type==="choice"){
      h+=`<section class="q"><div class="q-num">Q${n}</div><div class="qlabel">${esc(b.label)} <span class="req">*</span></div>
        <div class="choices ${b.row?'row':''}" data-extra="${b.q}">${(b.opts||[]).map(o=>`<button type="button" class="cbtn" data-v="${esc(o)}"><span class="rd"></span>${esc(o)}</button>`).join("")}</div></section>`;
    }else if(b.type==="imgchoice"){
      h+=`<section class="q"><div class="q-num">Q${n}</div><div class="qlabel">${esc(b.label)} <span class="req">*</span></div>
        <div class="imgchoices" data-extra="${b.q}">${(b.opts||[]).map(o=>`<button type="button" class="imgc" data-v="${esc(o.label)}">${o.image?`<img src="${esc(o.image)}" alt="">`:'<div class="noimg">사진 없음</div>'}<span>${esc(o.label)}</span></button>`).join("")}</div></section>`;
    }else if(b.type==="text"){
      h+=`<section class="q"><div class="q-num">Q${n}</div><div class="qlabel">${esc(b.label)}</div><textarea data-extra="${b.q}"></textarea></section>`;
    }else if(b.type==="module"){
      h+=`<section class="q"><div class="q-num">Q${n}</div><div class="optional-mod"><span class="modtag">◎ 선택 · ${esc(b.tag||"")}</span><div class="qlabel" style="margin:8px 0 12px">${esc(b.label)}</div>`;
      h+= (b.opts&&b.opts.length)?`<div class="choices row" data-extra="${b.q}">${b.opts.map(o=>`<button type="button" class="cbtn" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`:`<textarea data-extra="${b.q}" placeholder="${esc(b.ph||"")}"></textarea>`;
      h+=`</div></section>`;
    }
    n++;
  });
  if(!opt.preview) h+=`<div class="submit-wrap"><button type="submit" class="submit" id="submitBtn">평가 제출하기</button><p class="err" id="err"></p><p class="foot-note">인생푸드 · 응답은 자동으로 누적됩니다</p></div>`;
  h+=`</form>`; return h;
}
function renderForm(){ $("app").innerHTML=buildFormHtml(CFG,{}); wireForm(); }
function wireForm(){
  document.querySelectorAll(".scale").forEach(sc=>sc.querySelectorAll(".sbtn").forEach(btn=>btn.onclick=()=>{
    sc.querySelectorAll(".sbtn").forEach(x=>x.classList.remove("on"));btn.classList.add("on");
    (answers.scores[sc.dataset.prod]=answers.scores[sc.dataset.prod]||{})[sc.dataset.axis]=+btn.dataset.v;prog();}));
  document.querySelectorAll("[data-seg]").forEach(ch=>ch.querySelectorAll(".cbtn").forEach(btn=>btn.onclick=()=>{
    ch.querySelectorAll(".cbtn").forEach(x=>x.classList.remove("on"));btn.classList.add("on");answers[ch.dataset.seg]=btn.dataset.v;prog();}));
  document.querySelectorAll(".choices[data-extra]").forEach(ch=>ch.querySelectorAll(".cbtn").forEach(btn=>btn.onclick=()=>{
    ch.querySelectorAll(".cbtn").forEach(x=>x.classList.remove("on"));btn.classList.add("on");answers.extras[ch.dataset.extra]=btn.dataset.v;prog();}));
  document.querySelectorAll(".imgchoices[data-extra]").forEach(ch=>ch.querySelectorAll(".imgc").forEach(btn=>btn.onclick=()=>{
    ch.querySelectorAll(".imgc").forEach(x=>x.classList.remove("on"));btn.classList.add("on");answers.extras[ch.dataset.extra]=btn.dataset.v;prog();}));
  document.querySelectorAll("textarea[data-extra]").forEach(t=>t.oninput=()=>{answers.extras[t.dataset.extra]=t.value;});
  $("form").addEventListener("click",ev=>{const s=ev.target.closest("section.q.missing");if(s)s.classList.remove("missing");});
  $("form").onsubmit=submit;
}
function isPick(b){return b.type==="price"||b.type==="choice"||b.type==="imgchoice";}
function reqCount(){let c=2;CFG.blocks.forEach(b=>{if(b.type==="product")c+=AXES.length;if(isPick(b))c++;});return c;}
function doneCount(){let c=0;if(answers.gender)c++;if(answers.age)c++;CFG.blocks.forEach(b=>{if(b.type==="product"){const s=answers.scores[b.name]||{};c+=AXES.filter(a=>s[a.key]).length;}if(isPick(b)&&answers.extras[b.q])c++;});return c;}
function prog(){$("pbar").style.width=Math.min(100,6+doneCount()/reqCount()*94)+"%";}
function attrEsc(v){return String(v).replace(/["\\]/g,'\\$&');}
function firstMissing(){
  if(!answers.gender)return {msg:"성별을 선택해 주세요",sel:'[data-seg="gender"]'};
  if(!answers.age)return {msg:"연령대를 선택해 주세요",sel:'[data-seg="age"]'};
  for(const b of CFG.blocks){
    if(b.type==="product"){const s=answers.scores[b.name]||{};for(const a of AXES)if(!s[a.key])return {msg:`'${b.name}'의 [${a.label}] 점수를 선택해 주세요`,sel:`.scale[data-prod="${attrEsc(b.name)}"][data-axis="${a.key}"]`};}
    if(isPick(b)&&!answers.extras[b.q])return {msg:`'${b.label}'을(를) 선택해 주세요`,sel:`[data-extra="${attrEsc(b.q)}"]`};
  } return null;
}
async function submit(e){
  e.preventDefault();
  const err=$("err"),btn=$("submitBtn");const miss=firstMissing();
  if(miss){
    err.textContent="⚠ "+miss.msg;err.style.display="block";
    document.querySelectorAll("section.q.missing").forEach(x=>x.classList.remove("missing"));
    const tgt=miss.sel?document.querySelector(miss.sel):null; const sec=tgt?tgt.closest("section.q"):null;
    if(sec){ sec.classList.add("missing"); sec.scrollIntoView({behavior:"smooth",block:"center"}); }
    return;
  }
  err.style.display="none";
  const items=CFG.blocks.filter(b=>b.type==="product").map(b=>({brand:b.brand,name:b.name,cat:b.cat||"",...answers.scores[b.name]}));
  const payload={survey_slug:CFG.slug||"default",gender:answers.gender,age:answers.age,items,extras:answers.extras};
  if(!sb){err.textContent="⚠ 서버 연결이 설정되지 않았습니다.";err.style.display="block";return;}
  btn.disabled=true;btn.textContent="제출 중…";
  const {error}=await sb.from("svy_responses").insert(payload);
  if(error){err.textContent="⚠ 저장 실패: "+error.message;err.style.display="block";btn.disabled=false;btn.textContent="평가 제출하기";return;}
  $("done").classList.add("show");window.scrollTo(0,0);
}
if($("again")) $("again").onclick=()=>{answers.scores={};answers.extras={};answers.gender=null;answers.age=null;$("done").classList.remove("show");renderForm();window.scrollTo(0,0);};

/* ===== 결과 잠금 ===== */
let unlocked=false;
function tryUnlock(){
  const key=(CONF.RESULTS_KEY||"").toString();
  const v=$("lockInput").value.trim();
  if(!key){ unlocked=true; } // 키 미설정 시 잠금 없음
  else if(v===key){ unlocked=true; }
  else { $("lockErr").textContent="비밀번호가 올바르지 않습니다."; return; }
  $("lockPanel").classList.add("hidden");$("dash").classList.remove("hidden");
  try{ sessionStorage.setItem("svy_unlocked","1"); }catch(e){}
  startDash();
}
$("lockBtn").onclick=tryUnlock;
$("lockInput").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
try{ if(sessionStorage.getItem("svy_unlocked")==="1"){ unlocked=true; } }catch(e){}

/* ===== DASHBOARD ===== */
let ROWS=[],timer=null,dashStarted=false,viewSlug=null;
const dstate={brand:"전체",age:"전체",gender:"전체",product:0};
async function startDash(){
  $("lockPanel").classList.add("hidden");$("dash").classList.remove("hidden");
  if(!sb){$("cfgBanner").style.display="block";}
  if(!dashStarted){ dashStarted=true; if(timer)clearInterval(timer); timer=setInterval(loadDash,15000); $("csvBtn").onclick=exportCsv; $("reportBtn").onclick=openReport; $("refreshBtn").onclick=async()=>{await populateRounds();await loadDash();}; }
  await populateRounds(); loadDash();
}
async function populateRounds(){
  const sel=$("roundSel"); if(!sel||!sb)return;
  const counts={}; let respSlugs=[];
  try{ const {data}=await sb.from("svy_responses").select("survey_slug,created_at").order("created_at",{ascending:false});
    (data||[]).forEach(r=>{counts[r.survey_slug]=(counts[r.survey_slug]||0)+1;}); respSlugs=[...new Set((data||[]).map(r=>r.survey_slug))]; }catch(e){}
  let surveySlugs=[]; try{ const {data}=await sb.from("svy_surveys").select("slug,created_at").order("created_at",{ascending:false}); surveySlugs=(data||[]).map(r=>r.slug); }catch(e){}
  const cur=CFG.slug||"default";
  const valid=new Set([cur,...respSlugs,...surveySlugs]);
  if(viewSlug && !valid.has(viewSlug)) viewSlug=null; // 삭제된 회차 선택 방지
  // 활성 회차에 응답이 없고 다른 회차에 응답이 있으면 응답 있는 회차를 자동 선택
  if(!viewSlug && !(counts[cur]>0) && respSlugs.length){ viewSlug=respSlugs[0]; }
  const shown=viewSlug||cur;
  const all=[...valid];
  sel.innerHTML=all.map(s=>`<option value="${esc(s)}" ${s===shown?'selected':''}>${esc(s)}${counts[s]?` · ${counts[s]}명`:' · 0명'}</option>`).join("");
  sel.onchange=()=>{viewSlug=sel.value;loadDash();};
}
async function loadDash(){
  if(!sb){renderDash();return;}
  const slug=viewSlug||CFG.slug||"default";
  const {data,error}=await sb.from("svy_responses").select("*").eq("survey_slug",slug).order("created_at",{ascending:true});
  if(error){$("dbody").innerHTML=`<div class="empty">불러오기 실패: ${esc(error.message)}</div>`;return;}
  ROWS=data||[];renderDash();
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=v=>v.toFixed(1);
const mean5=s=>avg(AXES.map(a=>s[a.key]).filter(v=>typeof v==="number"));
function evAll(){const ev=[];ROWS.forEach(r=>{(r.items||[]).forEach(it=>{ev.push({gender:r.gender,age:r.age,brand:it.brand,name:it.name,cat:it.cat,s:it});});});return ev;}
function evF(){return evAll().filter(e=>(dstate.brand==="전체"||e.brand===dstate.brand)&&(dstate.age==="전체"||e.age===dstate.age)&&(dstate.gender==="전체"||e.gender===dstate.gender));}
function rowsF(){return ROWS.filter(r=>(dstate.age==="전체"||r.age===dstate.age)&&(dstate.gender==="전체"||r.gender===dstate.gender));}
function buildFilters(){
  const F={brand:["전체",...brandList()],age:["전체",...CFG.segments.age],gender:["전체",...CFG.segments.gender]};
  document.querySelectorAll(".chips[data-filter]").forEach(box=>{const key=box.dataset.filter;box.innerHTML="";
    F[key].forEach(v=>{const b=document.createElement("button");b.className="chip"+(dstate[key]===v?" on":"");b.textContent=v;
      if(key==="brand"&&v!=="전체"){const d=document.createElement("span");d.className="brand-dot";d.style.background=brandColor(v);b.prepend(d);}
      b.onclick=()=>{dstate[key]=v;renderDash();};box.appendChild(b);});});
}
function renderDash(){
  buildFilters();
  $("dsub").textContent=`${viewSlug||CFG.slug} · 총 ${ROWS.length}명 응답`;
  if(!ROWS.length){$("dbody").innerHTML=`<div class="empty">아직 응답이 없습니다.<br>「📝 응답하기」에서 첫 응답을 넣거나 QR을 공유하세요.</div>`;return;}
  const ev=evF(),resp=rowsF();const names=[...new Set(evAll().map(e=>e.name))];
  $("dbody").innerHTML=`<div class="kpis" id="kpis"></div><div class="insight" id="insight"></div>
    <div class="grid g2 block"><div class="card"><h2>🚦 제품 랭킹 · 출시 판정</h2><p class="cap">관능 5축 평균 기준</p><div style="overflow-x:auto"><table id="rankTable"></table></div></div>
    <div class="card"><h2>🔥 세그먼트 × 맛 히트맵</h2><p class="cap">연령대별 5축 평균</p><div class="heat" id="heat"></div></div></div>
    <section class="card block"><h2 style="margin-bottom:12px">제품 상세</h2><div class="prod-picker" id="prodPicker"></div>
      <div class="grid g2"><div><p class="cap" style="margin-bottom:2px">관능 프로필</p><div class="radar-wrap"><svg id="radar" width="300" height="240" viewBox="0 0 300 240"></svg></div><div class="radar-legend" id="radarLegend"></div></div>
      <div id="votes"></div></div></section>

  if(!BRANDS_REG.length){ el.innerHTML=`<div class="empty" style="padding:12px">등록된 브랜드가 없습니다. 위 버튼으로 등록하세요.</div>`; return; }
  el.innerHTML=BRANDS_REG.map(b=>`<div class="srow"><div class="si" style="display:flex;align-items:center;gap:10px"><span class="brand-dot" style="width:15px;height:15px;background:${esc(b.color)}"></span><b style="font-size:14.5px">${esc(b.name)}</b></div>
    <div class="arow-actions"><input type="color" class="acolor" value="${esc(b.color)}" data-name="${esc(b.name)}" title="색 변경"><button class="abtn" data-del="${esc(b.name)}">삭제</button></div></div>`).join("");
  el.querySelectorAll("input[type=color]").forEach(inp=>inp.onchange=async e=>{ try{ await sb.from("svy_brands").update({color:e.target.value}).eq("name",e.target.dataset.name);}catch(x){} await loadBrands(); renderBrandList(); if(ed)renderProductRows(); });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async ()=>{ if(!confirm(`'${b.dataset.del}' 브랜드를 삭제할까요? (이미 저장된 설문에는 영향 없음)`))return; try{ await sb.from("svy_brands").delete().eq("name",b.dataset.del);}catch(x){} await loadBrands(); renderBrandList(); if(ed)renderProductRows(); });
}
async function addBrand(){
  const name=prompt("새 브랜드 이름 (예: 어화락)"); if(!name||!name.trim())return;
  const palette=["#c1553a","#2f8f5b","#3a6ea5","#c9922b","#7d5ba6","#4a9d9c"];
  const color=palette[BRANDS_REG.length%palette.length];
  try{ const {error}=await sb.from("svy_brands").upsert({name:name.trim(),color,note:"",sort:BRANDS_REG.length+1}); if(error){alert("등록 실패: "+error.message);return;} }catch(x){alert("등록 실패");return;}
  await loadBrands(); renderBrandList(); if(ed)renderProductRows();
}
function renderQR(){
  const url=location.origin+location.pathname;
  $("qrArea").innerHTML=`<div class="fld"><label>응답 주소 (이 QR을 찍으면 응답 폼이 열립니다 · 응답자는 결과·관리 탭이 안 보임)</label><input id="qrUrl" value="${esc(url)}"></div>
    <button class="abtn primary" id="qrGen">QR 만들기</button><div class="qrbox" id="qrbox"></div>
    <p style="font-size:11.5px;color:var(--faint);margin-top:2px">QR을 우클릭 → 이미지 저장으로 인쇄·게시하세요.</p>
    <p style="font-size:11.5px;color:var(--muted);margin-top:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px">🔑 <b>관리자 주소(사장·본부용)</b> — 결과·관리 탭은 이 주소로만 보입니다. 북마크 해두세요:<br><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);user-select:all;word-break:break-all">${esc(url)}#admin</span></p>`;
  $("qrGen").onclick=()=>{const u=$("qrUrl").value.trim();if(!u)return;$("qrbox").innerHTML=`<img width="230" height="230" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=16&data=${encodeURIComponent(u)}">`;};
}
function suggestSlug(){const d=new Date();const base=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-시식";let s=base,n=1;while(SURVEYS.some(x=>x.slug===s)){n++;s=base+"-"+n;}return s;}
function startNew(){
  const base=((SURVEYS.find(s=>s.is_open)||SURVEYS[0]||{}).config)||CFG;
  draft=JSON.parse(JSON.stringify(base)); draft.slug=suggestSlug(); draftIsNew=true; buildEditModel(); renderAdmin();
  setTimeout(()=>{const e=$("editorArea");if(e)e.scrollIntoView({behavior:"smooth"});},60);
}
function editSurvey(slug){
  const s=SURVEYS.find(x=>x.slug===slug); if(!s)return;
  draft=JSON.parse(JSON.stringify(s.config)); draft.slug=s.slug; draftIsNew=false; buildEditModel(); renderAdmin();
  setTimeout(()=>{const e=$("editorArea");if(e)e.scrollIntoView({behavior:"smooth"});},60);
}
async function activateSurvey(slug){
  if(!sb)return;
  try{ await sb.from("svy_surveys").update({is_open:false}).neq("slug",slug); await sb.from("svy_surveys").update({is_open:true}).eq("slug",slug); }
  catch(e){ alert("활성화 실패: "+e.message); return; }
  await loadSurveys(); renderAdmin(); loadActiveSurvey();
}
function buildEditModel(){
  const products=draft.blocks.filter(b=>b.type==="product").map(b=>({brand:b.brand,name:b.name,tag:b.tag||""}));
  const extras=draft.blocks.filter(b=>b.type!=="product").map(b=>{
    const o={type:b.type,q:b.q,label:b.label||"",opts:"",input:b.input||"",ph:b.ph||"",imgopts:[]};
    if(b.type==="imgchoice") o.imgopts=(b.opts||[]).map(x=>({label:x.label||"",image:x.image||""}));
    else o.opts=(b.opts||[]).join("\n");
    return o;
  });
  ed={slug:draft.slug,title:(draft.meta&&draft.meta.title)||"",intro:(draft.meta&&draft.meta.intro)||"",showRubric:!(draft.meta&&draft.meta.showRubric===false),brands:((draft.meta&&draft.meta.brands)||[]).map(b=>({name:b.name,color:b.color||"#c1553a"})),products,extras};
}
function renderEditor(){
  const el=$("editorArea");
  let h=`<div class="acard"><h3>👁 미리보기 <span style="font-weight:400;color:var(--faint);font-size:11px">— 응답자에게 보이는 화면 (편집하면 실시간 반영)</span></h3><div class="prev-wrap"><div id="previewBody" class="prev-body"></div></div></div>`;
  h+=`<div class="acard"><h3>${draftIsNew?'새 시식 만들기':'회차 편집'} <button class="abtn ghost" id="edCancel" style="float:right">닫기</button></h3>`;
  h+=`<div class="fld"><label>회차 ID</label><input id="ed_slug" value="${esc(ed.slug)}" ${draftIsNew?'':'readonly style="opacity:.6"'}></div>`;
  h+=`<div class="fld"><label>제목</label><input id="ed_title" value="${esc(ed.title)}"></div>`;
  h+=`<div class="fld"><label>소개 문구</label><textarea id="ed_intro" rows="2">${esc(ed.intro)}</textarea></div>`;
  h+=`<div class="fld"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="ed_rubric" ${ed.showRubric?'checked':''} style="width:auto;margin:0"> 점수 기준 보기 표시 <span style="color:var(--faint);font-weight:400;font-size:11px">(껐다 켰다 가능 · 응답 폼 상단 안내)</span></label></div>`;
  h+=`<p style="font-size:11.5px;color:var(--faint);margin:0 0 12px">브랜드는 위 <b>브랜드 관리</b>에서 등록하면 아래 제품의 브랜드 목록에 자동으로 나타납니다.</p>`;
  h+=`<div class="fld"><label>제품 <span style="color:var(--faint)">(제품마다 5축 자동 포함)</span></label><div id="ed_products"></div><button class="addbtn" id="addProduct">+ 제품</button></div>`;
  h+=`<div class="fld"><label>추가 문항 (가격·선호투표·자유의견·추천)</label><div id="ed_extras"></div><button class="addbtn" id="addExtra">+ 문항</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="abtn primary" id="edSaveAct">저장 &amp; 응답 폼에 활성화</button><button class="abtn" id="edSave">저장만</button></div></div>`;
  el.innerHTML=h;
  $("ed_slug").oninput=e=>ed.slug=e.target.value.trim();
  $("ed_title").oninput=e=>ed.title=e.target.value;
  $("ed_intro").oninput=e=>ed.intro=e.target.value;
  $("ed_rubric").onchange=e=>{ed.showRubric=e.target.checked;};
  renderProductRows();renderExtraRows();
  $("addProduct").onclick=()=>{ed.products.push({brand:(BRANDS_REG[0]&&BRANDS_REG[0].name)||"",name:"새 제품",tag:""});renderProductRows();};
  $("addExtra").onclick=()=>{ed.extras.push({type:"price",q:"q"+Math.random().toString(36).slice(2,7),label:"새 문항",opts:"",input:"",ph:""});renderExtraRows();};
  $("edCancel").onclick=()=>{draft=null;ed=null;renderAdmin();};
  $("edSaveAct").onclick=()=>saveDraft(true);
  $("edSave").onclick=()=>saveDraft(false);
  updatePreview();
  el.addEventListener("input",schedulePreview);
  el.addEventListener("change",schedulePreview);
}
let _prevT=null;
function schedulePreview(){ clearTimeout(_prevT); _prevT=setTimeout(updatePreview,180); }
function updatePreview(){ if(!ed)return; const pb=$("previewBody"); if(!pb)return; try{ pb.innerHTML=buildFormHtml(buildDraftCfg(),{preview:true}); }catch(e){ pb.innerHTML='<div class="empty" style="padding:20px">미리보기 오류</div>'; } }
function renderBrandRows(){
  const el=$("ed_brands");
  el.innerHTML=ed.brands.map((b,i)=>`<div class="erow" style="grid-template-columns:1fr 44px 38px"><input value="${esc(b.name)}" data-i="${i}" data-k="name" placeholder="브랜드명"><input type="color" class="acolor" value="${esc(b.color||'#c1553a')}" data-i="${i}" data-k="color"><button class="del" data-i="${i}">×</button></div>`).join("");
  el.querySelectorAll("input").forEach(inp=>inp.oninput=e=>{ed.brands[+e.target.dataset.i][e.target.dataset.k]=e.target.value;});
  el.querySelectorAll(".del").forEach(b=>b.onclick=()=>{ed.brands.splice(+b.dataset.i,1);renderBrandRows();renderProductRows();});
}
function renderProductRows(){
  const el=$("ed_products");const bopts=regBrandNames();
  el.innerHTML=ed.products.map((p,i)=>`<div class="erow" style="grid-template-columns:1fr 1.2fr 1fr 38px"><select data-i="${i}">${bopts.map(n=>`<option ${n===p.brand?'selected':''}>${esc(n)}</option>`).join("")}</select><input value="${esc(p.name)}" data-i="${i}" data-k="name" placeholder="제품명"><input value="${esc(p.tag)}" data-i="${i}" data-k="tag" placeholder="태그(예: 칼국수·기본)"><button class="del" data-i="${i}">×</button></div>`).join("");
  el.querySelectorAll("input").forEach(inp=>inp.oninput=e=>{ed.products[+e.target.dataset.i][e.target.dataset.k]=e.target.value;});
  el.querySelectorAll("select").forEach(s=>s.onchange=e=>{ed.products[+e.target.dataset.i].brand=e.target.value;});
  el.querySelectorAll(".del").forEach(b=>b.onclick=()=>{ed.products.splice(+b.dataset.i,1);renderProductRows();});
}
function renderExtraRows(){
  const el=$("ed_extras");const types=[["price","가격 선택"],["choice","선호 투표"],["imgchoice","사진 투표"],["text","자유 의견"],["module","추천(선택)"]];
  el.innerHTML=ed.extras.map((x,i)=>{const needOpts=(x.type==="price"||x.type==="choice"||(x.type==="module"&&x.input!=="text"));
    let bl=`<div class="erow" style="grid-template-columns:1fr 1.6fr 38px"><select data-i="${i}" data-k="type">${types.map(t=>`<option value="${t[0]}" ${t[0]===x.type?'selected':''}>${t[1]}</option>`).join("")}</select><input value="${esc(x.label)}" data-i="${i}" data-k="label" placeholder="질문 문구"><button class="del" data-i="${i}">×</button></div>`;
    if(x.type==="imgchoice") bl+=`<div style="margin-top:8px" id="imgopts_${i}"></div><button type="button" class="addbtn" data-addimg="${i}">+ 사진 항목</button>`;
    else if(needOpts) bl+=`<div style="margin-top:6px"><textarea rows="3" style="width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--ink);resize:vertical" data-i="${i}" data-k="opts" placeholder="선택지 — 한 줄에 하나씩:&#10;10,000원&#10;11,000원&#10;12,000원">${esc(x.opts)}</textarea></div>`;
    if(x.type==="module") bl+=`<label style="font-size:11.5px;color:var(--muted);display:block;margin-top:7px"><input type="checkbox" data-i="${i}" data-k="modtext" ${x.input==="text"?'checked':''}> 자유입력(직접 추천)으로 받기</label>`;
    return `<div style="border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px">${bl}</div>`;}).join("");
  el.querySelectorAll("[data-k]").forEach(inp=>{if(inp.dataset.k==="imglabel")return;const ev=(inp.tagName==="SELECT"||inp.type==="checkbox")?"onchange":"oninput";
    inp[ev]=e=>{const i=+e.target.dataset.i,k=e.target.dataset.k;
      if(k==="modtext"){ed.extras[i].input=e.target.checked?"text":"";renderExtraRows();}
      else if(k==="type"){ed.extras[i].type=e.target.value;if(e.target.value==="imgchoice"&&!ed.extras[i].imgopts)ed.extras[i].imgopts=[];renderExtraRows();}
      else ed.extras[i][k]=e.target.value;};});
  el.querySelectorAll("[data-addimg]").forEach(b=>b.onclick=()=>{const i=+b.dataset.addimg;(ed.extras[i].imgopts=ed.extras[i].imgopts||[]).push({label:"",image:""});renderImgOpts(i);});
  el.querySelectorAll(".del").forEach(b=>b.onclick=()=>{ed.extras.splice(+b.dataset.i,1);renderExtraRows();});
  ed.extras.forEach((x,i)=>{if(x.type==="imgchoice")renderImgOpts(i);});
}
function renderImgOpts(i){
  const el=$("imgopts_"+i); if(!el)return;
  const list=ed.extras[i].imgopts||(ed.extras[i].imgopts=[]);
  el.innerHTML=list.length?list.map((o,j)=>`<div class="erow" style="grid-template-columns:54px 1fr 60px 34px;align-items:center;margin-bottom:6px">
    <div style="width:50px;height:50px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2) ${o.image?`url('${esc(o.image)}')`:''} center/cover no-repeat"></div>
    <input value="${esc(o.label)}" data-i="${i}" data-j="${j}" data-k="imglabel" placeholder="항목명 (예: 금색)">
    <button type="button" class="abtn" data-up="${i}_${j}">사진</button><button type="button" class="del" data-delimg="${i}_${j}">×</button></div>`).join(""):`<p style="font-size:11.5px;color:var(--faint);margin:0 0 4px">아래 버튼으로 사진 항목을 추가하세요.</p>`;
  el.querySelectorAll("input[data-k=imglabel]").forEach(inp=>inp.oninput=e=>{ed.extras[+e.target.dataset.i].imgopts[+e.target.dataset.j].label=e.target.value;});
  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>pickPhoto(b.dataset.up));
  el.querySelectorAll("[data-delimg]").forEach(b=>b.onclick=()=>{const p=b.dataset.delimg.split("_").map(Number);ed.extras[p[0]].imgopts.splice(p[1],1);renderImgOpts(p[0]);});
}
function pickPhoto(key){
  const p=key.split("_").map(Number);const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;const url=await uploadPhoto(f);if(url){ed.extras[p[0]].imgopts[p[1]].image=url;renderImgOpts(p[0]);}};
  inp.click();
}
async function uploadPhoto(file){
  if(!sb){alert("서버 연결이 필요합니다");return null;}
  if(file.size>5*1024*1024){alert("사진이 너무 큽니다(5MB 이하).");return null;}
  try{
    const ext=((file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";
    const path="q/"+Date.now()+"_"+Math.random().toString(36).slice(2,7)+"."+ext;
    const {error}=await sb.storage.from("svy-photos").upload(path,file,{cacheControl:"3600",upsert:false});
    if(error){alert("사진 업로드 실패: "+error.message);return null;}
    return sb.storage.from("svy-photos").getPublicUrl(path).data.publicUrl;
  }catch(e){alert("사진 업로드 오류: "+(e.message||e));return null;}
}
function buildDraftCfg(){
  const blocks=[];
  ed.products.forEach(p=>{if(!p.name)return;blocks.push({type:"product",brand:p.brand,name:p.name,tag:p.tag,cat:(p.tag||"").split(/[·|]/)[0].trim()});});
  ed.extras.forEach(x=>{const b={type:x.type,q:x.q||("q"+Math.random().toString(36).slice(2,7)),label:x.label};
    if(x.type==="price"){b.opts=(x.opts||"").split("\n").map(s=>s.trim()).filter(Boolean);}
    else if(x.type==="choice"){b.opts=(x.opts||"").split("\n").map(s=>s.trim()).filter(Boolean);b.row=true;}
    else if(x.type==="imgchoice"){b.opts=(x.imgopts||[]).filter(o=>o.label).map(o=>({label:o.label,image:o.image||""}));}
    else if(x.type==="text"){b.ph=x.ph||"";}
    else if(x.type==="module"){b.tag="추천 · 선택";if(x.input==="text"){b.input="text";b.ph=x.ph||"";}else{b.opts=(x.opts||"").split("\n").map(s=>s.trim()).filter(Boolean);}}
    blocks.push(b);});
  const cfg=JSON.parse(JSON.stringify(draft)); cfg.slug=ed.slug; cfg.meta=cfg.meta||{};
  cfg.meta.title=ed.title; cfg.meta.intro=ed.intro; cfg.meta.showRubric=ed.showRubric;
  const usedBrands=[...new Set(blocks.filter(b=>b.type==="product").map(b=>b.brand))].filter(Boolean);
  cfg.meta.brands=usedBrands.map(n=>({name:n,color:regColor(n)}));
  cfg.blocks=blocks; return cfg;
}
async function saveDraft(activate){
  if(!ed.slug){alert("회차 ID를 입력하세요");return;} if(!sb){alert("서버 연결이 필요합니다");return;}
  const cfg=buildDraftCfg();
  const up={slug:cfg.slug,title:cfg.meta.title||cfg.slug,config:cfg};
  if(activate){ try{ await sb.from("svy_surveys").update({is_open:false}).neq("slug",cfg.slug); }catch(e){} up.is_open=true; }
  else if(draftIsNew){ up.is_open=false; }
  const {error}=await sb.from("svy_surveys").upsert(up);
  if(error){alert("저장 실패: "+error.message);return;}
  draft=null;ed=null;
  if(activate) await loadActiveSurvey();
  await loadSurveys(); renderAdmin();
  alert(activate?"저장하고 응답 폼에 활성화했습니다. (응답하기 탭에 반영됨)":"저장했습니다.");
}
</script>
</body>
</html>
