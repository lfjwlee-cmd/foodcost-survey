<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>설문 연결 점검(원본)</title></head>
<body style="font-family:system-ui,'Malgun Gothic',sans-serif;padding:18px;font-size:15px;line-height:1.6;color:#1d1b18;max-width:720px;margin:0 auto">
<h2>🔬 원본 응답 점검</h2>
<div id="sum" style="font-size:34px;font-weight:800;color:#2f8f5b;margin:6px 0">확인 중…</div>
<pre id="out" style="white-space:pre-wrap;word-break:break-all;background:#f4f2ee;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:12px"></pre>
<p style="color:#888;font-size:13px">이 화면 전체를 캡처해서 보내주세요.</p>
<script>
(async()=>{
  const sum=document.getElementById("sum"), out=document.getElementById("out");
  const URL_="https://aosqvruvmhaumckwuidn.supabase.co";
  const KEY_="sb_publishable_snEBmk1dvtRdsd63a7ef2g_eqYdbmLk";
  let log="시각: "+new Date().toString()+"\n(로컬 시계) Date.now()="+Date.now()+"\n브라우저: "+navigator.userAgent+"\n\n";
  const url=URL_+"/rest/v1/svy_responses?select=survey_slug,created_at&order=created_at.desc";
  log+="요청 URL:\n"+url+"\n\n";
  try{
    const t0=Date.now();
    const res=await fetch(url,{headers:{apikey:KEY_,Authorization:"Bearer "+KEY_},cache:"no-store"});
    const txt=await res.text();
    let hdrs=""; res.headers.forEach((v,k)=>hdrs+="  "+k+": "+v+"\n");
    log+="HTTP 상태: "+res.status+" "+res.statusText+" ("+(Date.now()-t0)+"ms)\n\n응답 헤더:\n"+hdrs+"\n응답 본문:\n"+txt.slice(0,800);
    let n="?"; try{const j=JSON.parse(txt); n=Array.isArray(j)?j.length:("객체:"+JSON.stringify(j).slice(0,100));}catch(e){n="파싱불가";}
    sum.textContent="총 응답 "+n+"건";
    if(res.status!==200) sum.style.color="#c0433a";
  }catch(e){ sum.textContent="요청 실패"; sum.style.color="#c0433a"; log+="예외: "+(e&&e.stack||e); }
  out.textContent=log;
})();
</script>
</body></html>
